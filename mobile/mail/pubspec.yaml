name: cloudity_mail
description: "Cloudity Mail — app mobile (boîtes, dossiers, PJ, envoi minimal, tests)."
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cloudity_shared:
    path: ../cloudity_shared
  cloudity_auth_broker:
    path: ../cloudity_auth_broker
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  file_picker: ^11.0.2
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.7

flutter:
  uses-material-design: true
