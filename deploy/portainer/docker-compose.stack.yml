# Stack Portainer PROD — pointer Compose path vers ce fichier, branche refs/heads/main
# Secrets : Portainer Environment variables (voir stack.env.example), pas dans Git
#
# Réseau NPM (edge) : même bridge que Nextcloud / nginx-proxy-manager.
# Dans Portainer → Networks, copie le nom exact (souvent nginx-proxy-manager_default)
# puis mets NPM_NETWORK=… dans les env de la stack.

include:
  - path: ../../docker-compose.yml
  - path: ../../docker-compose.prod.yml

networks:
  npm_edge:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy-manager_default}

services:
  auth-service:
    pull_policy: build
    environment:
      GO_ENV: production
  api-gateway:
    pull_policy: build
    environment:
      GO_ENV: production
    networks:
      - default
      - npm_edge
  admin-service:
    pull_policy: build
    environment:
      PYTHON_ENV: production
  cloudity-web:
    pull_policy: build
    environment:
      NODE_ENV: production
    networks:
      - default
      - npm_edge
  mail-directory-service:
    pull_policy: build
  passwords-service:
    pull_policy: build
  drive-service:
    pull_policy: build
  photos-service:
    pull_policy: build
  calendar-service:
    pull_policy: build
  notes-service:
    pull_policy: build
  tasks-service:
    pull_policy: build
  contacts-service:
    pull_policy: build
  postgres:
    restart: always
  redis:
    restart: always
