# ⛔ Ne plus utiliser ce chemin dans Portainer.
#
# Sous Portainer, les mounts `../../scripts` depuis deploy/portainer/
# sont hors project-dir → db-migrate exit 2 / postgres sans schéma.
#
# Compose path correct :
#   docker-compose.ghcr.yml
# (fichier à la racine du dépôt Git)

services:
  use_root_compose_path:
    image: alpine:3.20
    container_name: cloudity-wrong-compose-path
    command:
      - sh
      - -c
      - |
        echo "ERREUR Portainer: Compose path invalide." >&2
        echo "Utilise: docker-compose.ghcr.yml (racine du repo, pas deploy/portainer/...)" >&2
        exit 1
