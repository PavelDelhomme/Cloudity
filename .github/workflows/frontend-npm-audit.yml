# FE-SEC-SUPPLY-02 — audit npm HIGH/CRITICAL bloquant (frontend)
name: Frontend npm audit (HIGH)

on:
  push:
    branches: [main, master, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-npm-audit.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-npm-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-npm-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit-high:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci (lockfile)
        run: npm ci --no-audit --no-fund

      - name: rebuild esbuild (allowScripts)
        run: npm rebuild esbuild

      - name: npm audit --omit=dev --audit-level=high
        run: npm audit --omit=dev --audit-level=high

      - name: SBOM CycloneDX (artefact)
        if: always()
        run: |
          mkdir -p ../reports/sbom
          npx --yes @cyclonedx/cyclonedx-npm@4.0.0 \
            --output-file ../reports/sbom/frontend-cyclonedx.json \
            --output-format JSON \
            --package-lock-only \
            --omit dev

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-sbom-cyclonedx
          path: reports/sbom/frontend-cyclonedx.json
          if-no-files-found: warn
          retention-days: 30
